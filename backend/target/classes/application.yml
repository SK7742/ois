server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: oxford-csms
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:postgres.byjfotbnqblbkbqdmxsw}
    password: ${SPRING_DATASOURCE_PASSWORD:ois-db@123#}

# Security & JWT Configuration
oxford:
  csms:
    institution:
      name: "Oxford International School"
      location: "Harpur, Raxaul, East Champaran, Bihar"
      authorized-by: "Anil Kumar Gupt (Management)"
      lead-architect: "Shivam Kumar"
      target-capacity: 2000
    jwt:
      secret: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
      expiration-ms: 86400000 # 24 hours
    whatsapp:
      api-endpoint: "https://api.whatsapp.example.com/v1/messages"
      default-sender: "+91-6254-OXFORD"
      simulate: true

# Observability & Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.oxford.csms: INFO
    org.springframework.security: DEBUG
