version: '3.8'

# ==============================================================================
# Oxford International School CSMS - Containerized Application
# Cloud Managed Database: Supabase PostgreSQL (Port 5432)
# ==============================================================================

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: oxford-csms-app:latest
    container_name: oxford-csms-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Connects directly to Supabase Managed PostgreSQL
      - SPRING_DATASOURCE_URL=jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require
      - SPRING_DATASOURCE_USERNAME=postgres.byjfotbnqblbkbqdmxsw
      - SPRING_DATASOURCE_PASSWORD=ois-db@123#
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SERVER_PORT=8080
    extra_hosts:
      # Ensures 'host.docker.internal' resolves to host machine on Windows, macOS & Linux
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
