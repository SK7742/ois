version: '3.8'

# ==============================================================================
# Oxford International School CSMS - Containerized Application (Local MySQL DB)
# ==============================================================================
# In this topology:
# - Application (Spring Boot + Static Web UI) runs inside Docker on port 8080.
# - MySQL Database stays on the LOCAL HOST machine on port 3306.
# - The container connects to the host database via 'host.docker.internal'.
# ==============================================================================

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: oxford-csms-app:latest
    container_name: oxford-csms-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Connects directly to local MySQL running on host machine
      - SPRING_DATASOURCE_URL=jdbc:mysql://host.docker.internal:3306/school?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SERVER_PORT=8080
    extra_hosts:
      # Ensures 'host.docker.internal' resolves to host machine on Windows, macOS & Linux
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
